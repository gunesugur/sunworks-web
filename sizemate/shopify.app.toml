# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d7df366dcc87d5b1dc6e0666dd08e584"
name = "sizemate"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# read_products: collection/product pickers and assignment suggestions
# read_themes:   check whether the app embed is switched on (setup guide)
# write_files:   upload chart photos to Content › Files (Pro photo card)
# read_locales:  list store languages for chart translations
scopes = "read_locales,read_products,read_themes,write_files"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Plan changes made on Shopify's pricing page: republish so paid features
  # switch on or off on the storefront straight away.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  # Mandatory privacy webhooks for App Store apps.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false

# Insights (Plus): the storefront sends anonymous counts to /apps/sizemate/e.
# `shopify app dev` points this at the dev tunnel; set your server URL before deploying.
[app_proxy]
url = "https://example.com/proxy"
subpath = "sizemate"
prefix = "apps"
