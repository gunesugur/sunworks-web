name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CI: true
  # Tests run against the bundled seed content so editor changes in Sanity can't break CI.
  CONTENT_SOURCE: local

jobs:
  quality:
    name: Lint, types, unit tests, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx astro check
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 3

  studio:
    name: Sanity Studio (types, audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=low
      - run: npx sanity build --yes

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Local secrets (Cloudflare Turnstile always-pass test keys)
        run: |
          cp .dev.vars.example .dev.vars && echo 'RATE_LIMIT_MAX=1000' >> .dev.vars
          cp .dev.vars dist/server/.dev.vars
      - run: npx wrangler d1 migrations apply sunworks-db --local -c dist/server/wrangler.json
      - run: npx playwright test
        env:
          PW_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7

  lighthouse-links:
    name: Lighthouse + link check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: |
          cp .dev.vars.example .dev.vars
          cp .dev.vars dist/server/.dev.vars
          npx wrangler d1 migrations apply sunworks-db --local -c dist/server/wrangler.json
      - name: Start preview server
        run: |
          npx wrangler dev -c dist/server/wrangler.json --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          npx --yes wait-on@9.1.0 -t 90000 http-get://127.0.0.1:8788/
      - name: Lighthouse (desktop)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
      - name: Link check
        run: npx linkinator http://127.0.0.1:8788/ --recurse --skip "^(?!http://127.0.0.1:8788)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
