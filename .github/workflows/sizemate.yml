name: Sizemate (Shopify app)

on:
  push:
    branches: [main]
    paths: ["sizemate/**", ".github/workflows/sizemate.yml"]
  pull_request:
    paths: ["sizemate/**", ".github/workflows/sizemate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sizemate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sizemate

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sizemate/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:storefront
      - run: npm audit --audit-level=high
      - run: npm run build

  storefront:
    name: Storefront (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sizemate/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test
        env:
          PW_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sizemate-playwright-${{ matrix.browser }}
          path: sizemate/playwright-report
          retention-days: 7
